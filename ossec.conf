<!-- /var/ossec/etc/ossec.conf snippet -->
<syscheck>
  <!-- Enforce File Integrity Monitoring (FIM) -->
  <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
  <directories check_all="yes" realtime="yes">/var/www,/etc/nginx</directories>
  
  <!-- Ignore temporary files -->
  <ignore>/etc/mtab</ignore>
  <ignore>/etc/hosts.deny</ignore>
</syscheck>

<rootcheck>
  <!-- Detect kernel-level rootkits -->
  <system_audit>/var/ossec/etc/shared/cis_ubuntu22-04.txt</system_audit>
</rootcheck>
