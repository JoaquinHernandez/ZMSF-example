# /etc/mongod.conf
net:
  port: 27017
  # Bind exclusively to loopback / secure tunnel
  bindIp: 127.0.0.1
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/ssl/mongodb.pem

security:
  # Enforce Role-Based Access Control
  authorization: "enabled"
  # Note: Disk-level encryption is managed via LUKS mount at /var/lib/mongodb
